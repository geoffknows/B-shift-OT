<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B Shift OT</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .app {
      max-width: 700px;
      margin: 0 auto;
      padding: 16px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0;
    }

    .calendar-header button {
      border: none;
      background: #222;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 18px;
    }

    #monthTitle {
      font-size: 20px;
      font-weight: bold;
    }

    .weekdays,
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .weekdays div {
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: #666;
      padding-bottom: 4px;
    }

    .day {
      min-height: 72px;
      background: white;
      border-radius: 10px;
      padding: 6px;
      box-sizing: border-box;
      border: 2px solid transparent;
      position: relative;
    }

    .day-number {
      font-weight: bold;
      font-size: 14px;
    }

    .shift-label {
      margin-top: 8px;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      padding: 4px;
      border-radius: 6px;
    }

    .day-shift {
      background: #d7ebff;
    }

    .night-shift {
      background: #e6dcff;
    }

    .off-shift {
      background: #eeeeee;
    }

    .empty {
      background: transparent;
    }

    .legend {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      font-size: 13px;
    }

    .legend span {
      padding: 6px 10px;
      border-radius: 8px;
    }

    .legend-day {
      background: #d7ebff;
    }

    .legend-night {
      background: #e6dcff;
    }

    .legend-off {
      background: #eeeeee;
    }
    .login-box {
  max-width: 360px;
  margin: 40px auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
}

.login-box input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

.login-box button,
.logout-btn {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  background: #222;
  color: white;
  font-size: 16px;
}

#loginMessage {
  margin-top: 10px;
  font-size: 14px;
}

#appContent {
  display: none;
}

.user-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.logout-btn {
  width: auto;
  padding: 8px 12px;
  margin: 0;
}
  </style>
</head>

<body>
  <div id="loginScreen" class="login-box">
  <h1>B Shift OT</h1>

  <input
    id="loginEmail"
    type="email"
    placeholder="Email"
  />

  <input
    id="loginPassword"
    type="password"
    placeholder="Password"
  />

  <button id="loginButton" type="button">Log in</button>

<button id="createAccountButton" type="button">
  Create account
</button>

<div id="loginMessage"></div>
</div>
<div id="registerScreen" class="login-box" style="display:none;">
  <h1>Create account</h1>

  <input id="registerName" type="text" placeholder="Full name" />

  <input id="registerUsername" type="text" placeholder="Username" />

  <input id="registerEmail" type="email" placeholder="Email" />

  <input id="registerPassword" type="password" placeholder="Password" />

  <input id="registerConfirmPassword" type="password" placeholder="Confirm password" />

  <button id="requestAccountButton" type="button">
    Request account
  </button>

  <button id="backToLoginButton" type="button">
    Back to login
  </button>

  <div id="registerMessage"></div>
</div>
<div id="appContent">
  <div class="app">
    <h1>B Shift OT</h1>

    <div class="calendar-header">
      <button onclick="changeMonth(-1)">‹</button>
      <div id="monthTitle"></div>
      <button onclick="changeMonth(1)">›</button>

    <div class="weekdays">
      <div>Mon</div>

      <div>Sat</div>
      <div>Sun</div>

    <div id="calendar" class="calendar"></div>

      <span class="legend-night">Night Shift</span>
      <span class="legend-off">Off</span>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ilmgkxfekvtdpwgjhgqn.supabase.co";

const SUPABASE_KEY = "sb_publishable_uXzAZiKEQ3Mx1pUMgNBHpA_5JGO5BVK";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
    async function login() {
  const message = document.getElementById("loginMessage");

  try {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    if (!email || !password) {
      message.textContent = "Enter your email and password.";
      return;
    }

    message.textContent = "Logging in...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      message.textContent = "Login failed: " + error.message;
      return;
    }

    if (!data.user) {
      message.textContent = "Login failed. No user returned.";
      return;
    }

    message.textContent = "Login successful.";

    await showLoggedInApp(data.user);

  } catch (err) {
    message.textContent = "Error: " + err.message;
  }
}
document
  .getElementById("loginButton")
  .addEventListener("click", login);
    
  document
  document
  .getElementById("createAccountButton")
  .addEventListener("click", showCreateAccount);

document
  .getElementById("backToLoginButton")
  .addEventListener("click", showLogin);

function showCreateAccount() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("registerScreen").style.display = "block";
}

function showLogin() {
  document.getElementById("registerScreen").style.display = "none";
  document.getElementById("loginScreen").style.display = "block";
}
}

async function logout() {
  await supabaseClient.auth.signOut();

  document.getElementById("loginScreen").style.display = "block";
  document.getElementById("appContent").style.display = "none";
}

async function showLoggedInApp(user) {
  const { data: profile, error } = await supabaseClient
    .from("profiles")
    .select("full_name, username, role, approval_status")
    .eq("id", user.id)
    .single();

  if (error) {
    document.getElementById("loginMessage").textContent =
      "Could not load your profile.";
    return;
  }

  if (profile.approval_status !== "approved") {
    await supabaseClient.auth.signOut();

    document.getElementById("loginMessage").textContent =
      "Your account is waiting for approval.";
    return;
  }

  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appContent").style.display = "block";

  const app = document.querySelector(".app");

  let existingBar = document.getElementById("userBar");

  if (!existingBar) {
    const bar = document.createElement("div");
    bar.id = "userBar";
    bar.className = "user-bar";

    bar.innerHTML = `
      <div>
        <strong>${profile.full_name}</strong>
        ${profile.role === "admin" ? " · Admin" : ""}
      </div>

      <button class="logout-btn" onclick="logout()">Log out</button>
    `;

    app.insertBefore(bar, app.children[1]);
  }
}

async function checkLogin() {
  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (session) {
    await showLoggedInApp(session.user);
  }
}

checkLogin();
  // B Shift rota:
  // 15 September 2026 = first DAY shift
  const rotaPattern = ["DAY", "DAY", "NIGHT", "NIGHT", "OFF", "OFF", "OFF", "OFF"];

  let displayYear = 2026;
  let displayMonth = 8; // September (January = 0)

  function getShift(year, month, day) {
    const start = Date.UTC(2026, 8, 15);
    const target = Date.UTC(year, month, day);

    const daysDifference = Math.round(
      (target - start) / 86400000
    );

    const rotaPosition =
      ((daysDifference % 8) + 8) % 8;

    return rotaPattern[rotaPosition];
  }

  function renderCalendar() {
    const calendar = document.getElementById("calendar");
    const title = document.getElementById("monthTitle");

    calendar.innerHTML = "";

    const monthName = new Date(
      displayYear,
      displayMonth,
      1
    ).toLocaleDateString("en-GB", {
      month: "long",
      year: "numeric"
    });

    title.textContent = monthName;

    // Work out which weekday the month starts on.
    // Convert Sunday=0 into Monday-first format.
    let firstWeekday =
      new Date(displayYear, displayMonth, 1).getDay();

    firstWeekday =
      firstWeekday === 0 ? 6 : firstWeekday - 1;

    // Blank spaces before the 1st of the month
    for (let i = 0; i < firstWeekday; i++) {
      const blank = document.createElement("div");
      blank.className = "day empty";
      calendar.appendChild(blank);
    }

    const numberOfDays =
      new Date(displayYear, displayMonth + 1, 0).getDate();

    for (let day = 1; day <= numberOfDays; day++) {
      const shift = getShift(
        displayYear,
        displayMonth,
        day
      );

      const box = document.createElement("div");
      box.className = "day";

      const number = document.createElement("div");
      number.className = "day-number";
      number.textContent = day;

      const label = document.createElement("div");
      label.className = "shift-label";

      if (shift === "DAY") {
        label.classList.add("day-shift");
        label.textContent = "DAY";
      } else if (shift === "NIGHT") {
        label.classList.add("night-shift");
        label.textContent = "NIGHT";
      } else {
        label.classList.add("off-shift");
        label.textContent = "OFF";
      }

      box.appendChild(number);
      box.appendChild(label);
      calendar.appendChild(box);
    }
  }

  function changeMonth(direction) {
    displayMonth += direction;

    if (displayMonth > 11) {
      displayMonth = 0;
      displayYear++;
    }

    if (displayMonth < 0) {
      displayMonth = 11;
      displayYear--;
    }

    renderCalendar();
  }

  // Start the calendar
  renderCalendar();
  </script>
    </div>
  </body>
</html>
